name: 'Test Discord Webhook'

on:
  workflow_dispatch:

jobs:
  test-discord-notification:
    permissions:
      contents: read
    runs-on: [self-hosted, macOS, ARM64, pd2-trade]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Test Discord notification
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          node << 'EOF'
          const fs = require('fs');
          const https = require('https');
          const { execSync } = require('child_process');

          // Get version from package.json
          const packageJson = JSON.parse(fs.readFileSync('./package.json', 'utf8'));
          const version = packageJson.version;
          const currentTag = `app-v${version}`;

          // Get previous tag
          execSync('git fetch --tags', { stdio: 'inherit' });
          const tags = execSync('git tag --sort=-v:refname')
            .toString()
            .trim()
            .split('\n')
            .filter(tag => /^app-v\d+\.\d+\.\d+$/.test(tag));

          const previousTag = tags.length > 1 ? tags[1] : 'app-v0.0.0';
          const compareUrl = `https://github.com/errolgr/pd2-trade/compare/${previousTag}...${currentTag}`;

          // Extract changelog entries for this version
          const content = fs.readFileSync('./src/assets/changeLog.ts', 'utf8');
          // Match both single and double quotes for version key
          const versionRegex = new RegExp(`['"]${version.replace(/\./g, '\\.')}['"]:\\s*\\[([\\s\\S]*?)\\]`, 'm');
          const match = content.match(versionRegex);

          let changelogText = 'No changelog entries found for this version.';
          if (match) {
            const entriesBlock = match[1];
            // Extract string entries, handling both single and double quotes with escaped strings
            const entries = [];
            // Match strings with single or double quotes, handling escaped quotes
            const stringRegex = /(['"])((?:(?!\1)[^\\]|\\.)*)\1/g;
            let m;
            while ((m = stringRegex.exec(entriesBlock)) !== null) {
              // Unescape the string
              const quote = m[1]; // The quote character used
              const entry = m[2]
                .replace(/\\n/g, '\n')
                .replace(/\\'/g, "'")
                .replace(/\\"/g, '"')
                .replace(/\\\\/g, '\\');
              entries.push(entry);
            }
            
            // Format with bullet points; Discord rejects a description over 4096 characters (400 {"embeds": ["0"]})
            const DESCRIPTION_LIMIT = 4096;
            const bullets = entries.map(entry => `• ${entry}`);
            const more = n => `…and ${n} more in What's New in the app`;
            changelogText = bullets.join('\n');
            if (changelogText.length > DESCRIPTION_LIMIT) {
              const budget = DESCRIPTION_LIMIT - more(bullets.length).length - 1;
              const kept = [];
              for (const bullet of bullets) {
                if ([...kept, bullet].join('\n').length > budget) break;
                kept.push(bullet);
              }
              changelogText = [...kept, more(bullets.length - kept.length)].join('\n');
            }
          }

          // Create Discord embed payload
          const payload = {
            embeds: [{
              title: `🚀 PD2 Trader v${version} Released`,
              description: changelogText,
              color: 3447003,
              fields: [
                {
                  name: '📦 Download',
                  value: `[View Release](https://github.com/errolgr/pd2-trade/releases/tag/${currentTag})`,
                  inline: true
                },
                {
                  name: '📝 Code Changes',
                  value: `[View Changes](${compareUrl})`,
                  inline: true
                }
              ],
              footer: {
                text: 'PD2 Trader'
              },
              timestamp: new Date().toISOString()
            }]
          };

          // Send to Discord
          const webhookUrl = process.env.DISCORD_WEBHOOK_URL;
          if (!webhookUrl) {
            console.log('DISCORD_WEBHOOK_URL not set, skipping Discord notification');
            process.exit(0);
          }

          const url = new URL(webhookUrl);
          const postData = JSON.stringify(payload);

          const options = {
            hostname: url.hostname,
            port: url.port || 443,
            path: url.pathname + url.search,
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Content-Length': Buffer.byteLength(postData)
            }
          };

          const req = https.request(options, (res) => {
            let data = '';
            res.on('data', (chunk) => { data += chunk; });
            res.on('end', () => {
              if (res.statusCode >= 200 && res.statusCode < 300) {
                console.log('Discord notification sent successfully');
              } else {
                console.error(`Discord webhook failed: ${res.statusCode} ${data}`);
                process.exit(1);
              }
            });
          });

          req.on('error', (error) => {
            console.error(`Error sending Discord notification: ${error.message}`);
            process.exit(1);
          });

          req.write(postData);
          req.end();
          EOF
